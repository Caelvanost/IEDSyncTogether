name: Dispatch patched IED build for lan

on:
  push:
    branches:
      - lan
    paths:
      - integration/ied-dev/**
      - .github/workflows/dispatch-patched-ied-lan.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch pinned IED build on lan
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-patched-ied.yml --repo ${{ github.repository }} --ref lan
