name: Build IEDSyncTogether plugin on lan

on:
  push:
    branches:
      - lan
    paths:
      - CMakeLists.txt
      - vcpkg.json
      - vcpkg-configuration.json
      - include/**
      - src/**
      - .github/workflows/build-plugin-lan.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vcpkg = Join-Path $env:RUNNER_TEMP 'vcpkg'
          git clone https://github.com/microsoft/vcpkg.git $vcpkg
          & (Join-Path $vcpkg 'bootstrap-vcpkg.bat') -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg bootstrap failed.' }
          "VCPKG_ROOT=$vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake"
          if ($LASTEXITCODE -ne 0) { throw 'CMake configure failed.' }
      - name: Build
        shell: pwsh
        run: |
          $generated = Join-Path $env:GITHUB_WORKSPACE 'build\__IEDSyncTogetherPlugin.cpp'
          if (Test-Path -LiteralPath $generated) {
            $text = Get-Content -LiteralPath $generated -Raw
            if ($text -notmatch 'using namespace std::literals') {
              [System.IO.File]::WriteAllText($generated, "using namespace std::literals;`r`n" + $text)
            }
          }
          cmake --build build --config Release
          if ($LASTEXITCODE -ne 0) { throw 'Plugin build failed.' }
