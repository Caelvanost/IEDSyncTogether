name: Build patched IED 1.7.4

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-patched-ied.yml
      - integration/ied-dev/**

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    env:
      IED_COMMIT: 3f014c3e8574ef0e88b2ec0b7cdf58b86c9737b0
      SKSE_MIRROR_COMMIT: 420507be00ad9a5c42c212a0956e4dedaecf0009
      NIGEOMETRY_COMPAT_COMMIT: 04b5a650f4392f5cb03f1fcd9146938307f221a7
      IED_CONFIGURATION: Release MT Post 629 143
      VCPKG_TRIPLET: x64-windows-rel-static-143

    steps:
      - name: Checkout IEDSyncTogether
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Prepare IED 1.7.4 workspace
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'ied-workspace'
          if (Test-Path $root) { Remove-Item $root -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $root | Out-Null

          git clone https://github.com/SlavicPotato/ied-dev.git (Join-Path $root 'ied-dev')
          git -C (Join-Path $root 'ied-dev') checkout $env:IED_COMMIT
          git clone https://github.com/clayne/sse-build-resources.git (Join-Path $root 'sse-build-resources')
          git clone https://github.com/clayne/imgui.git (Join-Path $root 'imgui')
          git clone --depth 1 https://github.com/bulletphysics/bullet3.git (Join-Path $root 'bullet3')
          git clone --depth 1 https://github.com/herumi/xbyak.git (Join-Path $root 'xbyak')
          git clone --depth 1 https://github.com/oneapi-src/oneTBB.git (Join-Path $root 'oneTBB')

          "IED_WORKSPACE=$root" | Out-File -FilePath $env:GITHUB_ENV -Append
          "IED_SOURCE_ROOT=$(Join-Path $root 'ied-dev')" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Prepare exact SKSE 2.0.17 source used by sse-build-resources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sse = Join-Path $env:IED_WORKSPACE 'sse-build-resources'
          $skseRoot = Join-Path $sse 'skse64'
          $mirror = Join-Path $env:RUNNER_TEMP 'skse-2.0.17-mirror'

          foreach ($path in @($skseRoot, $mirror)) {
            if (Test-Path $path) { Remove-Item $path -Recurse -Force }
          }

          git clone --filter=blob:none --no-checkout https://github.com/HydrogensaysHDT/hdt-skyrimse-mods.git $mirror
          git -C $mirror sparse-checkout init --cone
          git -C $mirror sparse-checkout set src/common src/skse64
          git -C $mirror checkout $env:SKSE_MIRROR_COMMIT
          if ($LASTEXITCODE -ne 0) { throw 'Unable to checkout pinned SKSE 2.0.17 mirror.' }

          $versionHeader = Join-Path $mirror 'src\skse64\skse64_common\skse_version.h'
          if (-not (Test-Path -LiteralPath $versionHeader -PathType Leaf)) {
            throw 'SKSE 2.0.17 version header is missing from the mirror.'
          }
          $versionText = Get-Content -LiteralPath $versionHeader -Raw
          if ($versionText -notmatch 'CURRENT_RELEASE_SKSE_STR\s+"2\.0\.17"') {
            throw 'Pinned mirror is not SKSE 2.0.17.'
          }

          New-Item -ItemType Directory -Force -Path $skseRoot | Out-Null
          Copy-Item -LiteralPath (Join-Path $mirror 'src\common') -Destination (Join-Path $skseRoot 'common') -Recurse -Force
          Copy-Item -LiteralPath (Join-Path $mirror 'src\skse64') -Destination (Join-Path $skseRoot 'skse64') -Recurse -Force

          # The HDT mirror carries a later local edit to NiGeometry.h despite
          # retaining the exact SKSE 2.0.17 version header. Replace only that
          # file with clayne's pristine 1.5.97-era copy, which is the input
          # expected by clayne/sse-build-resources' historical patch.
          $niGeometry = Join-Path $skseRoot 'skse64\skse64\NiGeometry.h'
          $niGeometryUrl = "https://raw.githubusercontent.com/clayne/sse_character_export/$env:NIGEOMETRY_COMPAT_COMMIT/src/skse64/skse64/NiGeometry.h"
          Invoke-WebRequest -UseBasicParsing -Uri $niGeometryUrl -OutFile $niGeometry

          Expand-Archive -LiteralPath (Join-Path $sse 'skse64-patch.zip') -DestinationPath $skseRoot -Force

          Push-Location $skseRoot
          try {
            git init
            git config user.email 'actions@github.com'
            git config user.name 'github-actions[bot]'
            git add -A
            git commit -m baseline

            $patch = Join-Path $skseRoot 'skse64.patch'
            if (-not (Test-Path -LiteralPath $patch -PathType Leaf)) {
              throw 'sse-build-resources skse64.patch not found.'
            }

            git apply --reject --whitespace=nowarn $patch
            $rejects = @(Get-ChildItem -Path $skseRoot -Recurse -Filter '*.rej' -File)
            $sourceRejects = @($rejects | Where-Object { $_.FullName -notmatch '\.vcxproj\.rej$' })
            if ($sourceRejects.Count -gt 0) {
              foreach ($reject in $sourceRejects) {
                Write-Host "==== SOURCE REJECT: $($reject.FullName) ====" -ForegroundColor Yellow
                Get-Content -LiteralPath $reject.FullName | ForEach-Object { Write-Host $_ }
              }
              throw "Historical sse-build-resources patch left $($sourceRejects.Count) source-code rejection(s)."
            }

            $projectRejects = @($rejects | Where-Object { $_.FullName -match '\.vcxproj\.rej$' })
            foreach ($reject in $projectRejects) {
              Write-Host "Ignoring unused SKSE project-file reject: $($reject.FullName)" -ForegroundColor DarkYellow
              Remove-Item -LiteralPath $reject.FullName -Force
            }

            # IED links the sibling sse-build-resources.vcxproj, which compiles
            # SKSE sources directly; the rejected original SKSE project files
            # are not referenced by the IED solution.
            $remainingRejects = @(Get-ChildItem -Path $skseRoot -Recurse -Filter '*.rej' -File)
            if ($remainingRejects.Count -ne 0) {
              throw 'Unexpected patch reject remains after compatibility handling.'
            }

            # git apply returns 1 whenever any hunk was rejected, even when the
            # only rejected files are the explicitly ignored original SKSE
            # project files above. Reset the native exit code after validating
            # that no source-code rejection remains.
            $global:LASTEXITCODE = 0
          } finally {
            Pop-Location
          }

      - name: Generate compatible Assimp project
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:IED_WORKSPACE 'assimp-source'
          $build = Join-Path $env:IED_WORKSPACE 'assimp'
          git clone --depth 1 --branch v5.2.5 https://github.com/assimp/assimp.git $source
          cmake -S $source -B $build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_CONFIGURATION_TYPES="$env:IED_CONFIGURATION" `
            -DASSIMP_BUILD_TESTS=OFF `
            -DASSIMP_BUILD_ASSIMP_TOOLS=OFF `
            -DASSIMP_BUILD_ZLIB=ON `
            -DBUILD_SHARED_LIBS=OFF `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          if ($LASTEXITCODE -ne 0) { throw 'Assimp CMake generation failed.' }
          Copy-Item -Path (Join-Path $source 'include\*') -Destination (Join-Path $build 'include') -Recurse -Force

      - name: Prepare vcpkg dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vcpkg = Join-Path $env:RUNNER_TEMP 'vcpkg'
          git clone https://github.com/microsoft/vcpkg.git $vcpkg
          & (Join-Path $vcpkg 'bootstrap-vcpkg.bat') -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg bootstrap failed.' }

          $tripletPath = Join-Path $vcpkg "triplets\community\$env:VCPKG_TRIPLET.cmake"
          @'
          set(VCPKG_TARGET_ARCHITECTURE x64)
          set(VCPKG_CRT_LINKAGE static)
          set(VCPKG_LIBRARY_LINKAGE static)
          '@ | Set-Content -LiteralPath $tripletPath -Encoding ASCII

          & (Join-Path $vcpkg 'vcpkg.exe') install --classic `
            "directxtk:$env:VCPKG_TRIPLET" `
            "jsoncpp:$env:VCPKG_TRIPLET" `
            "boost-locale:$env:VCPKG_TRIPLET" `
            "boost-serialization:$env:VCPKG_TRIPLET" `
            "tbb:$env:VCPKG_TRIPLET"
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg dependency installation failed.' }
          & (Join-Path $vcpkg 'vcpkg.exe') integrate install
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg MSBuild integration failed.' }
          "VCPKG_ROOT=$vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Apply IEDSyncTogether patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $patch = Join-Path $env:GITHUB_WORKSPACE 'integration\ied-dev\ied-sync-together.patch'
          Push-Location $env:IED_SOURCE_ROOT
          try {
            git apply --check $patch
            if ($LASTEXITCODE -ne 0) { throw 'IEDSyncTogether patch does not apply to IED 1.7.4.' }
            git apply $patch
            if ($LASTEXITCODE -ne 0) { throw 'Failed to apply IEDSyncTogether patch.' }
          } finally {
            Pop-Location
          }

      - name: Build patched IED 1.7.4
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $solution = Join-Path $env:IED_SOURCE_ROOT 'ImmersiveEquipmentDisplays.sln'
          $dummyGame = Join-Path $env:RUNNER_TEMP 'SkyrimSE'
          New-Item -ItemType Directory -Force -Path (Join-Path $dummyGame 'Data\SKSE\Plugins') | Out-Null

          msbuild $solution /m /t:ImmersiveEquipmentDisplays `
            "/p:Configuration=$env:IED_CONFIGURATION" `
            /p:Platform=x64 `
            "/p:VcpkgTriplet=$env:VCPKG_TRIPLET" `
            "/p:SSEPath=$dummyGame" `
            "/p:SSE_AE_PATH=$dummyGame" `
            "/p:AE_CURRENT_PATH=$dummyGame" `
            "/p:ENDERAL_SE_PATH=$dummyGame"
          if ($LASTEXITCODE -ne 0) { throw 'Patched IED build failed.' }

          $dll = Get-ChildItem -Path $env:IED_WORKSPACE -Recurse -Filter 'ImmersiveEquipmentDisplays.dll' -File |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $dll) { throw 'ImmersiveEquipmentDisplays.dll not found after build.' }

          $out = Join-Path $env:GITHUB_WORKSPACE 'third-party\IED-1.7.4\ImmersiveEquipmentDisplays.dll'
          Copy-Item -LiteralPath $dll.FullName -Destination $out -Force
          Get-FileHash -Algorithm SHA256 -LiteralPath $out | Format-List | Out-Host

      - name: Upload patched DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImmersiveEquipmentDisplays-1.7.4-IEDSyncTogether
          path: third-party/IED-1.7.4/ImmersiveEquipmentDisplays.dll
          if-no-files-found: error

      - name: Commit reproducible prebuilt DLL
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add -- third-party/IED-1.7.4/ImmersiveEquipmentDisplays.dll
          if (git diff --cached --quiet) {
            Write-Host 'Prebuilt patched IED DLL is already current.'
            exit 0
          }
          git commit -m 'Update prebuilt patched IED 1.7.4 DLL'
          git push origin HEAD:main
