[Network]
Enabled=1
AutoDiscovery=1
LocalPort=38471
PeerHost=127.0.0.1
PeerPort=38471
DiscoveryIntervalMs=2000
PeerTimeoutMs=10000

[Timing]
CaptureIntervalMs=750
ResendIntervalMs=5000

[Compatibility]
# Set to 1 to hide all IED-cloned gear on remote proxies when using an
# unpatched IED build. Leave at 0 when the slot-override integration is active.
SuppressRemoteNpcDisplays=0
