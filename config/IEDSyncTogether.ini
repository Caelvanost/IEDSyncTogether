; IEDSyncTogether v0.3.3 - automatic UDP client profile
; Installed for every user. The FOMOD Host option adds a small override file.
; No manual INI editing is required.

[Network]
Enabled=1
Disabled=0
Transport=UDP
UdpFallback=0
RequireStrBridge=0
AutoDiscovery=0
RelayMode=0
LocalPort=38471

; Client mode automatically reuses the host/address entered in Skyrim Together.
; The STR port is discarded and AutoRemotePort is used for IEDSyncTogether.
AutoRemoteFromSTR=1
AutoRemotePort=38471

; Reuse the Skyrim Together server password as the HMAC-SHA256 shared secret.
; Client: read from STR's localStorage after connecting to the STR server.
; Host: the FOMOD Host override switches RelayMode=1, causing the password
;       to be read from SkyrimTogetherReborn/config/STServer.ini instead.
AutoSharedSecretFromSTR=1

; Manual peers/secrets remain available for diagnostics but are not required.
RemotePeers=
PeerHost=
PeerPort=38471
SharedSecret=

DiscoveryIntervalMs=2000
PeerTimeoutMs=10000

[Timing]
CaptureIntervalMs=750
ResendIntervalMs=5000

[Compatibility]
# Set to 1 to hide all IED-cloned gear on remote proxies when using an
# unpatched IED build. Leave at 0 when the slot-override integration is active.
SuppressRemoteNpcDisplays=0
