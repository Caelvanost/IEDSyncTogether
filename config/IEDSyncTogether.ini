[Network]
Enabled=1
AutoDiscovery=1
LocalPort=38471
PeerHost=127.0.0.1
PeerPort=38471
DiscoveryIntervalMs=2000
PeerTimeoutMs=10000

[Timing]
CaptureIntervalMs=750
ResendIntervalMs=5000

[Compatibility]
# Legacy option name kept for compatibility with existing installs.
#
# v0.3.0 does NOT patch IED and does NOT call IED.AddActorBlock. With value 1,
# this key registers resolved STR proxies for IEDSyncTogether's authoritative
# non-inventory Custom Item renderer.
#
# DEVELOPMENT BASELINE: on every STR client, enable IED's native setting
# "Disable NPC equipment displays". IED then skips its normal equipment-slot
# renderer for NPCs/STR proxies while still processing Custom Items. The local
# PlayerCharacter remains handled normally by IED, including favorites and
# weapon-placement presets.
SuppressRemoteNpcDisplays=1
