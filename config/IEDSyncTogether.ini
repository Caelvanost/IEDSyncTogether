[Network]
Enabled=1
AutoDiscovery=1
LocalPort=38471
PeerHost=127.0.0.1
PeerPort=38471
DiscoveryIntervalMs=2000
PeerTimeoutMs=10000

[Timing]
CaptureIntervalMs=750
ResendIntervalMs=5000

[Compatibility]
# v0.1.13 validates a transparent IED 1.7.4 relay only. Remote displayed-slot
# overrides are intentionally not applied yet, so keep the safe NPC-display
# suppression fallback enabled to avoid showing a remote proxy's full inventory.
SuppressRemoteNpcDisplays=1
