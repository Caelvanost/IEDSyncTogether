[Network]
Enabled=1
AutoDiscovery=1
LocalPort=38471
PeerHost=127.0.0.1
PeerPort=38471
DiscoveryIntervalMs=2000
PeerTimeoutMs=10000

[Timing]
CaptureIntervalMs=750
ResendIntervalMs=5000

[Compatibility]
# Legacy option name kept for compatibility with existing installs. In v0.2.6,
# enabling it registers resolved STR proxies for the authoritative IED Custom
# Item renderer only. No IED runtime hook is installed and AddActorBlock is not
# used. Normal IED NPC slot rendering may therefore remain visible alongside
# synchronized Custom Items until a safe public integration path is available.
SuppressRemoteNpcDisplays=1
