[Network]
Enabled=1
AutoDiscovery=1
LocalPort=38471
PeerHost=127.0.0.1
PeerPort=38471
DiscoveryIntervalMs=2000
PeerTimeoutMs=10000

[Timing]
CaptureIntervalMs=750
ResendIntervalMs=5000

[Compatibility]
# The IED 1.7.4 slot hook is installed before save processing and remains
# dormant until a live remote snapshot exists. Leave NPC suppression disabled
# so the hook can replace IED's 19 equipment-display slot selections with the
# authoritative remote player's displayed/favorited state.
SuppressRemoteNpcDisplays=0
