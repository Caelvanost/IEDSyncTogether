[Network]
Enabled=1
AutoDiscovery=1
LocalPort=38471
PeerHost=127.0.0.1
PeerPort=38471
DiscoveryIntervalMs=2000
PeerTimeoutMs=10000

[Timing]
CaptureIntervalMs=750
ResendIntervalMs=5000

[Compatibility]
# Legacy option name kept for compatibility with existing installs. In v0.2.0,
# enabling it registers resolved STR proxies for the authoritative IED Custom
# Item renderer. IEDSyncTogether no longer calls AddActorBlock and does not patch
# ImmersiveEquipmentDisplays.dll.
SuppressRemoteNpcDisplays=1
