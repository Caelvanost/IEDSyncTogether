[Network]
Enabled=1
AutoDiscovery=1
LocalPort=38471
PeerHost=127.0.0.1
PeerPort=38471
DiscoveryIntervalMs=2000
PeerTimeoutMs=10000

[Timing]
CaptureIntervalMs=750
ResendIntervalMs=5000

[Compatibility]
# While the runtime slot-override hook is disabled, remote STR proxies would
# otherwise be treated as ordinary NPCs by IED and display inventory weapons
# that the owning player does not actually display. Block IED's normal NPC
# displays on those proxies until the safe slot-application path is restored.
SuppressRemoteNpcDisplays=1
