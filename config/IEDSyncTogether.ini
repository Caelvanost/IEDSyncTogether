[Network]
Enabled=1
AutoDiscovery=1
LocalPort=38471
PeerHost=127.0.0.1
PeerPort=38471
DiscoveryIntervalMs=2000
PeerTimeoutMs=10000

[Timing]
CaptureIntervalMs=750
ResendIntervalMs=5000

[Compatibility]
# Legacy option name kept for compatibility with existing installs. In v0.2.2,
# enabling it registers resolved STR proxies for authoritative Custom Item
# rendering and for the narrow in-memory stock-slot filter. IEDSyncTogether does
# not use AddActorBlock and never rebuilds/replaces/modifies the installed IED DLL
# file on disk.
SuppressRemoteNpcDisplays=1
