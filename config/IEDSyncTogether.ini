[Network]
Enabled=1
AutoDiscovery=1
LocalPort=38471
PeerHost=127.0.0.1
PeerPort=38471
DiscoveryIntervalMs=2000
PeerTimeoutMs=10000

[Timing]
CaptureIntervalMs=750
ResendIntervalMs=5000

[Compatibility]
# Legacy option name kept for compatibility with existing installs. In v0.2.5,
# enabling it registers resolved STR proxies for the authoritative IED Custom
# Item renderer and runtime-calibrated per-proxy ProcessSlots suppression.
# Suppression fails open until the PlayerCharacter Actor* field is calibrated;
# the local PlayerCharacter is explicitly excluded. Set this to 0 as an
# emergency fallback to restore entirely stock IED behavior during testing.
SuppressRemoteNpcDisplays=1
