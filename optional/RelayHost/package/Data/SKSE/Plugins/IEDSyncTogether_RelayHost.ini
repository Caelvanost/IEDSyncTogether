; IEDSyncTogether v0.3.3 - automatic UDP host override
; Selected by the FOMOD Host option. No manual INI editing is required.

[Network]
Transport=UDP
UdpFallback=0
RequireStrBridge=0
AutoDiscovery=0
RelayMode=1
LocalPort=38471

; The host receives clients on its forwarded UDP port, so it does not need
; to discover a remote endpoint from its own STR client connection.
AutoRemoteFromSTR=0
AutoRemotePort=38471

; In RelayMode the plugin reads sPassword from
; Data/SkyrimTogetherReborn/config/STServer.ini and uses it as the
; HMAC-SHA256 shared secret.
AutoSharedSecretFromSTR=1
SharedSecret=
